<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>🔐 Admin</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  font-family: Tahoma;
  background: #111;
  color: white;
  padding: 20px;
}
.private {
  background: #222;
  margin: 10px 0;
  padding: 10px;
  border-radius: 6px;
}
</style>
</head>

<body>

<h2>🔐 คำอวยพรลับ</h2>

<div id="list"></div>

<script>
const password = prompt("ใส่รหัสผ่าน Admin:");
if (password !== "1234") {
  alert("รหัสผ่านไม่ถูกต้อง");
  location.href = "index.html";
}

/* Firebase config (เหมือนหน้าแรก) */
const firebaseConfig = {
  apiKey: "AIzaSyC5nh5OL1fTZ1uPqiEUxWb735YHvdM5CCM",
  authDomain: "newyear-wish.firebaseapp.com",
  projectId: "newyear-wish",
  storageBucket: "newyear-wish.firebasestorage.app",
  messagingSenderId: "264802822732",
  appId: "1:264802822732:web:3ab75e129f8521053422e9",
  measurementId: "G-PB1VKW6T0J"
};


firebase.initializeApp(firebaseConfig);
const db = firebase.database();

db.ref("wishes").on("child_added", snap => {
  const data = snap.val();
  if (data.type === "private") {
    const div = document.createElement("div");
    div.className = "private";
    div.innerText = data.message;
    document.getElementById("list").appendChild(div);
  }
});
</script>

</body>
</html>
