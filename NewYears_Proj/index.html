<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 Happy New Year Night</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
/* ===== ธีมกลางคืน ===== */
body {
  margin: 0;
  background: radial-gradient(circle at top, #1b2735, #090a0f);
  color: #fff;
  font-family: Tahoma, sans-serif;
  overflow: hidden;
}

/* ดาว */
.star {
  position: fixed;
  width: 2px;
  height: 2px;
  background: white;
  opacity: .8;
}

/* UI ด้านบน */
.top-ui {
  position: fixed;
  top: 10px;
  width: 100%;
  padding: 0 12px;
  display: flex;
  justify-content: space-between;
  z-index: 999;
  font-size: 14px;
}

/* กล่องพิมพ์ */
.container {
  position: fixed;
  bottom: 15px;
  width: 100%;
  text-align: center;
}

textarea {
  width: 85%;
  max-width: 500px;
  height: 70px;
  border-radius: 14px;
  border: none;
  padding: 12px;
  font-size: 16px;
}

.options {
  margin: 6px;
  font-size: 14px;
}

button {
  padding: 10px 20px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg,#ffcc70,#ff8177);
  font-size: 15px;
}

/* ข้อความวิ่ง + เรืองแสง */
.wish {
  position: absolute;
  white-space: nowrap;
  font-size: 22px;
  animation: move 14s linear forwards;
}

@keyframes move {
  from { left: 100%; }
  to { left: -120%; }
}

/* ดอกไม้ไฟ */
.firework {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  animation: explode 1s ease-out forwards;
}

@keyframes explode {
  from { transform: scale(1); opacity: 1; }
  to { transform: scale(6); opacity: 0; }
}

/* 📱 ปรับมือถือ */
@media (max-width: 600px) {
  .wish { font-size: 18px; }
  textarea { height: 60px; }
}
</style>
</head>

<body>

<!-- ดาวพื้นหลัง -->
<script>
for(let i=0;i<120;i++){
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  document.body.appendChild(s);
}
</script>

<div class="top-ui">
  <div id="counter">🎁 0</div>
  <div>
    <button onclick="toggleSound()" id="soundBtn">🔊</button>
    <button onclick="openAdmin()">🔐</button>
  </div>
</div>

<div class="container">
  <textarea id="message" placeholder="เขียนคำอวยพรปีใหม่ ✨"></textarea>
  <div class="options">
    <label><input type="radio" name="type" value="public" checked> โชว์</label>
    <label><input type="radio" name="type" value="private"> ส่วนตัว</label>
  </div>
  <button onclick="sendWish()">ส่ง 🎆</button>
</div>

<audio id="bgm" src="newyear.mp3" loop></audio>

<script>
/* 🔥 Firebase */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_DOMAIN",
  databaseURL: "YOUR_DATABASE_URL",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* 🔊 เสียง */
const bgm=document.getElementById("bgm");
let playing=false;
function toggleSound(){
  playing?bgm.pause():bgm.play();
  document.getElementById("soundBtn").innerText=playing?"🔊":"🔇";
  playing=!playing;
}

/* ✨ สีเรืองแสงสุ่ม */
function randomGlow(){
  const colors=["#ffcc70","#7afcff","#ff7aed","#7CFF7A","#FFD700"];
  return colors[Math.floor(Math.random()*colors.length)];
}

/* ส่งข้อความ */
function sendWish(){
  const msg=message.value;
  const type=document.querySelector('input[name="type"]:checked').value;
  if(msg.trim()==="") return alert("กรุณาเขียนคำอวยพร");
  db.ref("wishes").push({message:msg,type:type});
  message.value="";
}

/* แสดงข้อความ */
function showWish(text){
  const d=document.createElement("div");
  const glow=randomGlow();
  d.className="wish";
  d.innerText=text;
  d.style.top=Math.random()*70+"%";
  d.style.color=glow;
  d.style.textShadow=`0 0 10px ${glow},0 0 20px ${glow}`;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),14000);
}

/* ดอกไม้ไฟ */
function firework(){
  for(let i=0;i<10;i++){
    const f=document.createElement("div");
    const c=randomGlow();
    f.className="firework";
    f.style.background=c;
    f.style.left=Math.random()*innerWidth+"px";
    f.style.top=Math.random()*innerHeight+"px";
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),1000);
  }
}

/* realtime */
let count=0;
db.ref("wishes").on("child_added",snap=>{
  const d=snap.val();
  count++;
  counter.innerText="🎁 "+count;
  if(d.type==="public"){
    showWish(d.message);
    firework();
  }
});

/* 🔐 Admin */
function openAdmin(){
  if(prompt("Admin password")!=="1234") return;
  db.ref("wishes").once("value",snap=>{
    let t="คำอวยพรลับ\n\n";
    snap.forEach(s=>{
      if(s.val().type==="private") t+="• "+s.val().message+"\n";
    });
    alert(t);
  });
}
</script>

</body>
</html>
