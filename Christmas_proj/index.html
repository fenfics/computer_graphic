<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Flip Card</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #fef9f3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    position: relative;
  }
  
  /* หิมะตกแบบมินิมอล */
  .snowflake {
    position: fixed;
    top: -10px;
    color: #e8d5c4;
    font-size: 0.8em;
    animation: fall linear infinite;
    opacity: 0.4;
    user-select: none;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes fall {
    to {
      transform: translateY(100vh);
    }
  }
  
  /* ข้อความต้อนรับแบบมินิมอล */
  .title {
    color: #d4a574;
    font-size: 1.8em;
    font-weight: 300;
    letter-spacing: 3px;
    margin-bottom: 40px;
    text-align: center;
  }
  
  /* คำบรรยายใต้ชื่อ */
  .subtitle {
    color: #b8977d;
    font-size: 0.9em;
    font-weight: 300;
    margin-top: -30px;
    margin-bottom: 30px;
    letter-spacing: 1px;
  }
  
  /* การ์ดแบบมินิมอล */
  .flip-card {
    width: min(420px, 90vw);
    height: min(420px, 90vw);
    perspective: 1000px;
    margin: 20px 0;
    position: relative;
    z-index: 10;
  }
  .flip-card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
    transform-style: preserve-3d;
  }
  .flip-card.flipped .flip-card-inner {
    transform: rotateY(180deg);
  }
  .flip-card-front,
  .flip-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 16px;
    overflow: hidden;
  }
  .flip-card-front img,
  .flip-card-back img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    box-shadow: 0 10px 40px rgba(212, 165, 116, 0.15);
  }
  .flip-card-back {
    transform: rotateY(180deg);
  }
  
  /* คำแนะนำแบบมินิมอล */
  .instruction {
    color: #b8977d;
    font-size: 0.85em;
    font-weight: 300;
    margin-top: 20px;
    letter-spacing: 1px;
    opacity: 0.7;
  }
  
  /* ซ่อนคำแนะนำบนมือถือ */
  @media (max-width: 768px) {
    .instruction {
      display: none;
    }
  }
  
  /* ปุ่มเสียงแบบมินิมอล */
  .sound-btn {
    margin-top: 30px;
    padding: 12px 30px;
    background: transparent;
    color: #d4a574;
    border: 1.5px solid #d4a574;
    border-radius: 25px;
    cursor: pointer;
    font-size: 0.95em;
    font-weight: 300;
    letter-spacing: 2px;
    transition: all 0.3s ease;
    position: relative;
    z-index: 10;
  }
  .sound-btn:hover {
    background: #d4a574;
    color: #fef9f3;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(212, 165, 116, 0.2);
  }
  .sound-btn:active {
    transform: translateY(0);
  }
  
  /* เส้นตกแต่งบน-ล่าง */
  .decoration-line {
    width: 60px;
    height: 1px;
    background: #d4a574;
    margin: 15px auto;
    opacity: 0.5;
  }
</style>
</head>
<body>
<!-- เพลง -->
<audio id="bgMusic" loop>
  <source src="https://raw.githubusercontent.com/fenfics/computer_graphic/main/PUN%20-%20santa%20doesnt%20know%20you%20like%20i%20do%20Original%20by%20Sabrina%20Carpenter.mp3" type="audio/mpeg">
</audio>

<div class="decoration-line"></div>
<h1 class="title">MERRY CHRISTMAS</h1>
<p class="subtitle">✧ Happy Holidays ✧</p>

<div class="flip-card">
  <div class="flip-card-inner">
    <div class="flip-card-front">
      <img src="https://raw.githubusercontent.com/fenfics/computer_graphic/main/front.jpg" alt="Front Card">
    </div>
    <div class="flip-card-back">
      <img src="https://raw.githubusercontent.com/fenfics/computer_graphic/main/back.jpg" alt="Back Card">
    </div>
  </div>
</div>

<p class="instruction">Tap or Hover to flip</p>

<button class="sound-btn" onclick="toggleSound()">
  ♪ PLAY MUSIC
</button>

<div class="decoration-line" style="margin-top: 30px;"></div>

<script>
  // หิมะตกแบบมินิมอล (น้อยลง)
  function createSnowflake() {
    const snowflake = document.createElement('div');
    snowflake.classList.add('snowflake');
    snowflake.innerHTML = '❄';
    snowflake.style.left = Math.random() * 100 + 'vw';
    snowflake.style.animationDuration = Math.random() * 4 + 6 + 's';
    snowflake.style.fontSize = Math.random() * 0.5 + 0.5 + 'em';
    document.body.appendChild(snowflake);
    setTimeout(() => {
      snowflake.remove();
    }, 10000);
  }
  setInterval(createSnowflake, 400);

  // ระบบเสียง
  const music = document.getElementById("bgMusic");
  const btn = document.querySelector(".sound-btn");
  
  function toggleSound() {
    if (music.paused) {
      music.play();
      btn.textContent = "♪ PAUSE MUSIC";
    } else {
      music.pause();
      btn.textContent = "♪ PLAY MUSIC";
    }
  }
  
  // ระบบพลิกการ์ดสำหรับมือถือและแท็บเล็ต
  const flipCard = document.querySelector('.flip-card');
  let isFlipped = false;
  
  flipCard.addEventListener('click', function() {
    isFlipped = !isFlipped;
    if (isFlipped) {
      flipCard.classList.add('flipped');
    } else {
      flipCard.classList.remove('flipped');
    }
  });
  
  // รองรับ hover บนคอมพิวเตอร์
  flipCard.addEventListener('mouseenter', function() {
    if (window.innerWidth > 768) {
      flipCard.classList.add('flipped');
    }
  });
  
  flipCard.addEventListener('mouseleave', function() {
    if (window.innerWidth > 768) {
      flipCard.classList.remove('flipped');
    }
  });
</script>
</body>
</html>
