<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Flip Card</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  /* การ์ด */
  .flip-card {
    width: 300px;
    height: 400px;
    perspective: 1000px;
  }

  .flip-card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.8s;
    transform-style: preserve-3d;
  }

  .flip-card:hover .flip-card-inner {
    transform: rotateY(180deg);
  }

  .flip-card-front,
  .flip-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
  }

  .flip-card-front img,
  .flip-card-back img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
  }

  .flip-card-back {
    transform: rotateY(180deg);
  }

  /* ปุ่มเสียง */
  .sound-btn {
    margin-top: 20px;
    padding: 10px 20px;
    background: #c62828;
    color: #fff;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 16px;
  }

  .sound-btn:hover {
    background: #a61c1c;
  }
</style>
</head>

<body>

<!-- เพลง (เปลี่ยนลิงก์เพลงได้) -->
<audio id="bgMusic" autoplay muted loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="flip-card">
  <div class="flip-card-inner">

    <!-- หน้า -->
    <div class="flip-card-front">
      <img src="https://raw.githubusercontent.com/fenfics/computer_graphic/main/front.jpg">
    </div>

    <!-- หลัง -->
    <div class="flip-card-back">
      <img src="https://raw.githubusercontent.com/fenfics/computer_graphic/main/back.jpg">
    </div>

  </div>
</div>

<!-- ปุ่มเปิด/ปิดเสียง -->
<button class="sound-btn" onclick="toggleSound()">
  🔇 เปิดเสียง
</button>

<script>
  const music = document.getElementById("bgMusic");
  const btn = document.querySelector(".sound-btn");

  function toggleSound() {
    if (music.muted) {
      music.muted = false;
      btn.textContent = "🔊 ปิดเสียง";
    } else {
      music.muted = true;
      btn.textContent = "🔇 เปิดเสียง";
    }
  }
</script>

</body>
</html>
