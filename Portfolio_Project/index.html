<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8" />
    <title>Night Amusement Park • Model</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        canvas {
            display: block;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>

<body>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
        camera.position.set(0, 3, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.25;
        controls.maxPolarAngle = Math.PI / 2;
        controls.enablePan = true;

        const loader = new THREE.TextureLoader();
        const objLoader = new THREE.OBJLoader();

        // URLs
        const heightMapURL = "https://doc.babylonjs.com/img/how_to/HeightMap/heightMap.png";
        const diffuseURL = "https://raw.githubusercontent.com/fenfics/computer_graphic/main/rocky_terrain_02_diff_1k.jpg";
        const bgURL = "https://raw.githubusercontent.com/fenfics/computer_graphic/main/colourful-horizon-lights-sky.jpg";
        const wallFrontURL = "https://raw.githubusercontent.com/fenfics/computer_graphic/main/IMG_3245.png";
        const modelURL = "https://raw.githubusercontent.com/fenfics/computer_graphic/main/model.obj";
        const enjoyURL = "https://raw.githubusercontent.com/fenfics/computer_graphic/main/enjoy.obj";
        const NameURL = "https://raw.githubusercontent.com/fenfics/computer_graphic/main/name.obj";
        const elmoURL = "https://raw.githubusercontent.com/fenfics/computer_graphic/main/elmo.obj";

        // Load specific textures for model.obj
        const texLoader = new THREE.TextureLoader();
        const modelTextures = [
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/poly_0.001_baseColor.jpeg'),
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/poly_0_baseColor.jpeg'),
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/poly_0.004_baseColor.jpeg'),
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/poly_0.002_baseColor.jpeg')
        ];

        // Load all textures for elmo shader
        const textures = [
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/3E6635E4_c.png'),
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/3EFB9D32_c.png'),
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/7BAD8BC0_c.png'),
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/623F8D60_c.png'),
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/177BC529_c.png'),
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/1952DE7A_c.png'),
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/4521FCFA_c.png'),
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/poly_0.001_baseColor.jpeg'),
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/poly_0_baseColor.jpeg'),
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/poly_0.004_baseColor.jpeg'),
            texLoader.load('https://raw.githubusercontent.com/fenfics/computer_graphic/main/poly_0.002_baseColor.jpeg')
        ];

        // Background
        loader.load(bgURL, (bgTex) => scene.background = bgTex);

        // Floor shader
        const uniforms = { uTime: { value: 0.0 }, uHeight: { value: null }, uTex: { value: null } };
        const vertFloor = `
            uniform sampler2D uHeight;
            varying float vH;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vec3 pos = position;
                float h = texture2D(uHeight, uv).r;
                pos.z += h * 1.0;
                vH = h;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
            }
        `;
        const fragFloor = `
            precision mediump float;
            uniform sampler2D uTex;
            varying float vH;
            varying vec2 vUv;
            void main() {
                vec3 texColor = texture2D(uTex, vUv).rgb;
                vec3 colorLow = vec3(0.05,0.03,0.02);
                vec3 colorHigh = vec3(0.0,0.25,0.0);
                vec3 heightColor = mix(colorLow,colorHigh,vH);
                vec3 finalColor = mix(texColor, heightColor, 0.5);
                gl_FragColor = vec4(finalColor,1.0);
            }
        `;

        // Load floor + walls
        loader.load(heightMapURL, (heightTex) => {
            loader.load(diffuseURL, (diffuseTex) => {
                diffuseTex.wrapS = diffuseTex.wrapT = THREE.RepeatWrapping;
                diffuseTex.repeat.set(4, 4);
                uniforms.uHeight.value = heightTex;
                uniforms.uTex.value = diffuseTex;

                const floorGeo = new THREE.PlaneBufferGeometry(10, 10, 200, 200);
                const floorMat = new THREE.ShaderMaterial({
                    vertexShader: vertFloor,
                    fragmentShader: fragFloor,
                    uniforms: uniforms,
                    side: THREE.DoubleSide
                });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2;
                scene.add(floor);

                const wallHeight = 5;

                // Front wall
                loader.load(wallFrontURL, (wallTex) => {
                    wallTex.wrapS = wallTex.wrapT = THREE.ClampToEdgeWrapping;
                    wallTex.minFilter = THREE.LinearFilter;
                    const wallFrontMat = new THREE.MeshBasicMaterial({ map: wallTex, side: THREE.DoubleSide });
                    const wallFront = new THREE.Mesh(new THREE.PlaneBufferGeometry(10, wallHeight), wallFrontMat);
                    wallFront.position.set(0, wallHeight / 2, -5);
                    scene.add(wallFront);
                });

                // Right wall
                const wallRight = new THREE.Mesh(
                    new THREE.PlaneBufferGeometry(10, wallHeight),
                    new THREE.MeshLambertMaterial({ color: 0x111111, side: THREE.DoubleSide })
                );
                wallRight.position.set(5, wallHeight / 2, 0);
                wallRight.rotation.y = -Math.PI / 2;
                scene.add(wallRight);

                // model.obj
                objLoader.load(modelURL, (obj) => {
                    obj.position.set(3, 0, 4.5);
                    obj.scale.set(1, 1, 1);
                    obj.rotation.y = -Math.PI / 2;

                    let texIndex = 0;
                    obj.traverse((child) => {
                        if (child.isMesh) {
                            const texture = modelTextures[texIndex % modelTextures.length];
                            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
                            texture.repeat.set(1, 1);
                            child.material = new THREE.MeshPhongMaterial({ map: texture });
                            texIndex++;
                        }
                    });
                    scene.add(obj);
                });

                // --- enjoy.obj + plane + ลูกบอลรอบป้าย ---
                objLoader.load(enjoyURL, (obj) => {
                    obj.traverse((child) => {
                        if (child.isMesh) {
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0x330066,
                                metalness: 0.6,
                                roughness: 0.3,
                                emissive: 0xffaa55,
                                emissiveIntensity: 0.6
                            });
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    obj.scale.set(0.8, 0.8, 0.8);
                    obj.position.set(5, wallHeight / 2 - 0.8, 0);
                    obj.rotation.y = -Math.PI / 2;
                    scene.add(obj);

                    // Plane เป็นพื้นหลังป้าย
                    const planeGeo = new THREE.PlaneGeometry(2.5, 2.5);
                    const planeMat = new THREE.MeshStandardMaterial({
                        color: 0xffffff,
                        metalness: 0.3,
                        roughness: 0.6,
                        emissive: 0xffffff,
                        emissiveIntensity: 0.2,
                        side: THREE.DoubleSide
                    });
                    const plane = new THREE.Mesh(planeGeo, planeMat);
                    plane.position.set(4.98, wallHeight / 2 + 0.3, -0.1);
                    plane.rotation.y = -Math.PI / 2;
                    scene.add(plane);

                    // กรอบป้าย
                    const edges = new THREE.EdgesGeometry(planeGeo);
                    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffaa00 }));
                    line.position.copy(plane.position);
                    line.rotation.copy(plane.rotation);
                    scene.add(line);

                    // SpotLight
                    const spot = new THREE.SpotLight(0xffffff, 1.5, 10, Math.PI / 6, 0.2, 2);
                    spot.position.set(5, wallHeight + 2, 2);
                    spot.target = obj;
                    spot.castShadow = true;
                    scene.add(spot);
                    scene.add(spot.target);

                    // --- ลูกบอลรอบป้าย ---
                    const ballCount = 8;
                    const balls = [];
                    const radius = 1.5;
                    const centerX = plane.position.x;
                    const centerY = plane.position.y;
                    const centerZ = plane.position.z;

                    for (let i = 0; i < ballCount; i++) {
                        const ballGeo = new THREE.SphereGeometry(0.1, 16, 16);
                        const ballMat = new THREE.MeshStandardMaterial({
                            color: new THREE.Color(`hsl(${i * 360 / ballCount}, 100%, 50%)`),
                            emissive: new THREE.Color(`hsl(${i * 360 / ballCount}, 100%, 50%)`),
                            metalness: 0.5,
                            roughness: 0.3
                        });
                        const ball = new THREE.Mesh(ballGeo, ballMat);
                        ball.castShadow = true;
                        ball.receiveShadow = true;
                        scene.add(ball);
                        balls.push({ mesh: ball, phase: (i / ballCount) * Math.PI * 2 });
                    }

                    // --- Animate ---
                    let angle = 0;
                    function animate() {
                        requestAnimationFrame(animate);
                        uniforms.uTime.value += 0.01;
                        controls.update();

                        // ลูกบอลหมุนรอบป้าย
                     // --- อัพเดตลูกบอลหมุนรอบป้ายแนวตั้ง ---
angle += 0.02; // ความเร็วหมุน
const tColor = performance.now() * 0.005; // ความเร็วเปลี่ยนสี
balls.forEach((b, i) => {
    b.mesh.position.set(
        centerX,  // X คงที่ (ตรงกลางป้าย)
        centerY + Math.cos(angle + b.phase) * radius,  // Y หมุนขึ้น-ลง
        centerZ + Math.sin(angle + b.phase) * radius   // Z หมุนรอบป้าย
    );

    // เปลี่ยนสีแบบไฟ LED
    const hue = ((tColor * 360 + i * 360 / ballCount) % 360);
    b.mesh.material.color.setHSL(hue / 360, 1, 0.5);
    b.mesh.material.emissive.setHSL(hue / 360, 1, 0.5);
});


                        // update elmoObj, parkLights
                        if (window.parkLights) {
                            const t = performance.now() * 0.002;
                            window.parkLights.forEach(obj => {
                                obj.light.intensity = 0.5 + 0.5 * Math.sin(t + obj.phase);
                                obj.light.color.offsetHSL(Math.sin(t + obj.phase) * 0.001, 0, 0);
                            });
                        }
                        if (window.elmoObj) {
                            window.elmoObj.traverse((child) => {
                                if (child.isMesh && child.material.uniforms) {
                                    child.material.uniforms.uTime.value = performance.now() / 1000;
                                    child.material.uniforms.uLightDir.value.set(
                                        Math.sin(performance.now() / 1000 * 2.0),
                                        0.4,
                                        0.8
                                    ).normalize();
                                }
                            });
                        }

                        renderer.render(scene, camera);
                    }
                    animate();
                });

                // Name.obj
                objLoader.load(NameURL, (obj) => {
                    obj.scale.set(0.2, 0.2, 0.2);
                    obj.position.set(4.97, 4, -4.5);
                    obj.rotation.y = -Math.PI / 2;

                    obj.traverse((child) => {
                        if (child.isMesh) {
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0x99CCFF,
                                metalness: 0.8,
                                roughness: 0.2,
                                emissive: 0x000000
                            });
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    scene.add(obj);

                    const spotLight = new THREE.SpotLight(0xffffff, 1.5, 20, Math.PI / 6, 0.2, 2);
                    spotLight.position.set(4.97, 8, -2);
                    spotLight.target = obj;
                    spotLight.castShadow = true;
                    scene.add(spotLight);
                    scene.add(spotLight.target);
                });

                // elmo.obj
                const vertElmo = `
                    uniform float uTime;
                    varying vec3 vNormal;
                    varying vec3 vPosW;
                    varying vec2 vUv;
                    void main() {
                        vNormal = normalize(mat3(modelMatrix) * normal);
                        vUv = uv;
                        vec3 pos = position;
                        vPosW = (modelMatrix * vec4(pos, 1.0)).xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `;
                const fragElmo = `
                    precision mediump float;
                    varying vec3 vNormal;
                    varying vec3 vPosW;
                    varying vec2 vUv;
                    uniform vec3 uLightDir;
                    uniform sampler2D uTex;
                    void main() {
                        float diffuse = clamp(dot(vNormal, uLightDir), 0.0, 1.0);
                        float levels = 3.0;
                        diffuse = floor(diffuse * levels) / levels;
                        diffuse += 0.6;
                        vec3 R = reflect(-uLightDir, vNormal);
                        vec3 V = normalize(cameraPosition - vPosW);
                        float specular = max(pow(dot(R,V), 4.0), 0.0);
                        specular = smoothstep(0.4, 0.6, specular);
                        if(diffuse <= 0.6) specular = 0.0;
                        vec3 base = texture2D(uTex, vUv).rgb;
                        vec3 color = (base * diffuse) + vec3(specular);
                        gl_FragColor = vec4(color, 1.0);
                    }
                `;
                objLoader.load(elmoURL, (obj) => {
                    let i = 0;
                    obj.traverse((child) => {
                        if (child.isMesh) {
                            const mat = new THREE.ShaderMaterial({
                                vertexShader: vertElmo,
                                fragmentShader: fragElmo,
                                uniforms: {
                                    uTime: { value: 0.0 },
                                    uLightDir: { value: new THREE.Vector3(0.4, 1, 0.8).normalize() },
                                    uTex: { value: textures[i % textures.length] }
                                }
                            });
                            child.material = mat;
                            i++;
                        }
                    });
                    obj.scale.set(10, 10, 10);
                    obj.position.set(-4, 0, -4.5);
                    scene.add(obj);
                    window.elmoObj = obj;
                });

                // Park lights
                window.parkLights = [];
                for (let i = 0; i < 20; i++) {
                    const color = new THREE.Color(`hsl(${i * 18}, 80%, 60%)`);
                    const l = new THREE.PointLight(color, 0.8, 6, 2);
                    const angle = i / 20 * Math.PI * 2;
                    l.position.set(Math.cos(angle) * 4, 1.5, Math.sin(angle) * 4);
                    scene.add(l);
                    window.parkLights.push({ light: l, phase: Math.random() * Math.PI * 2 });
                }
            });
        });

        // Lights
        scene.add(new THREE.AmbientLight(0x101010, 1.0));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.2);
        dirLight.position.set(5, 10, 2);
        scene.add(dirLight);

        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>

</html>
