<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PBR Model with Floor</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial;
        }
    </style>
</head>

<body>
    <div id="loading">Loading model and textures...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdddddd);

        // Camera
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // Floor
        const planeGeo = new THREE.PlaneGeometry(20, 20);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -1.2;
        plane.receiveShadow = true;
        scene.add(plane);

        // Lights
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const ambient = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambient);

        // Textures
        const texLoader = new THREE.TextureLoader();

        const chaBase = texLoader.load("https://raw.githubusercontent.com/fenfics/computer_graphic/main/Cha_BaseColor.png");
        chaBase.encoding = THREE.sRGBEncoding;
        const chaRough = texLoader.load("https://raw.githubusercontent.com/fenfics/computer_graphic/main/Cha_Roughness.png");

        const clothesBase = texLoader.load("https://raw.githubusercontent.com/fenfics/computer_graphic/main/clothes_BaseColor.png");
        clothesBase.encoding = THREE.sRGBEncoding;
        const clothesRough = texLoader.load("https://raw.githubusercontent.com/fenfics/computer_graphic/main/clothes_Roughness.png");

        const payungBase = texLoader.load("https://raw.githubusercontent.com/fenfics/computer_graphic/main/Payung_BaseColor.png");
        payungBase.encoding = THREE.sRGBEncoding;
        const payungMetal = texLoader.load("https://raw.githubusercontent.com/fenfics/computer_graphic/main/Payung_Metallic.png");
        const payungRough = texLoader.load("https://raw.githubusercontent.com/fenfics/computer_graphic/main/Payung_Roughness.png");

        // Materials
        const chaMat = new THREE.MeshPhysicalMaterial({
            map: chaBase,
            roughnessMap: chaRough,
            roughness: 0.8,
            metalness: 0.0,
        });

        const clothesMat = new THREE.MeshPhysicalMaterial({
            map: clothesBase,
            roughnessMap: clothesRough,
            roughness: 0.9,
            metalness: 0.0,
        });

        const payungMat = new THREE.MeshPhysicalMaterial({
            map: payungBase,
            metalnessMap: payungMetal,
            roughnessMap: payungRough,
            metalness: 0.8,
            roughness: 0.2,
        });

        // Mapping mesh name → material
        const meshMaterials = {
            "Circle": chaMat,
            "Circle.001": chaMat,
            "Circle.002": payungMat,
            "Plane.003": payungMat,
            "Circle.003": payungMat,
            "Circle.004": payungMat,
            "Circle.005": payungMat,
            "Circle.006": chaMat,
            "Circle.007": chaMat,
            "Circle.009": clothesMat,
            "Circle.010": payungMat,
            "Circle.012": clothesMat,
            "Circle.013": payungMat,
            "Circle.014": clothesMat,
            "Circle.017": clothesMat,
            "Circle.018": clothesMat,
            "Circle.019": clothesMat,
            "Circle.020": clothesMat,
            "Circle.021": clothesMat,
            "Circle.022": chaMat,
            "Cube": chaMat,
            "Cube.001": chaMat,
            "Cube.002": clothesMat,
            "Cube.003": clothesMat,
            "Cube.004": clothesMat,
            "Cube.005": clothesMat,
            "NurbsPath": clothesMat,
            "Plane": chaMat,
            "Plane.001": chaMat,
            "Plane.002": chaMat,
            "Plane.004": clothesMat,
            "Plane.005": clothesMat,
            "Plane.006": clothesMat,
            "Plane.008": clothesMat,
            "Plane.009": chaMat,
            "Plane.010": chaMat,
            "Plane.011": clothesMat,
            "Plane.012": clothesMat,
            "Plane.013": clothesMat,
            "Plane.014": clothesMat,
            "Plane.015": clothesMat,
        };

        // Load OBJ
        const objLoader = new THREE.OBJLoader();
        objLoader.load(
            "https://raw.githubusercontent.com/fenfics/computer_graphic/main/pbr.obj",
            function (object) {
                console.log('Model loaded, assigning materials...');
                object.traverse(function (child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (meshMaterials[child.name]) {
                            child.material = meshMaterials[child.name];
                        } else {
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0x888888,
                                roughness: 0.7,
                                metalness: 0.3,
                            });
                        }
                    }
                });
                object.scale.set(0.9, 0.9, 0.9);
                object.position.set(0, -2, 0);
                scene.add(object);
                document.getElementById('loading').style.display = 'none';
                console.log('✅ Model added to scene');
            },
            function (progress) {
                console.log('Loading progress:', (progress.loaded / progress.total * 100) + '%');
            },
            function (error) {
                console.error("Error loading OBJ:", error);
                document.getElementById('loading').innerHTML = 'Error loading model';
            }
        );

        // Animate
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('Three.js version:', THREE.REVISION);
    </script>
</body>

</html>
